<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Đổi đơn vị dung lượng"><title>Đổi đơn vị dung lượng</title><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#007c83"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dde7ec"/></pattern></defs><style>
  text{font-family:Segoe UI,Arial,sans-serif;fill:#0b1f33;font-size:20px;font-variant-numeric:tabular-nums}
  .label{font-size:20px}.small,.muted{font-size:17px;fill:#52677a}.title,.heading{font-size:28px;font-weight:700}.value{font-size:28px;font-weight:700;font-family:Consolas,monospace}
  rect.active,path.active,circle.active{fill:#e3f3f2;stroke:#007c83;stroke-width:3}rect.muted,path.muted,circle.muted{fill:#e8eef2;stroke:#839ead;stroke-width:2}
  .accent{fill:#007c83}.error{fill:#b33135}.success{fill:#176749}.wire{stroke:#738e9e;stroke-width:3;fill:none}.signal{stroke:#007c83;stroke-width:4;fill:none;stroke-dasharray:12 6;animation:flow .65s ease-out 1}
  .component{fill:#fff;stroke:#c8d8e1;stroke-width:2}.component.active{fill:#e3f3f2;stroke:#007c83;stroke-width:3}.active text{fill:#005e65}.box-title{font-size:18px;fill:#52677a;font-weight:600}.box-value{font-size:24px;font-weight:700}
  .bit{fill:#f5f8fa;stroke:#c8d8e1;stroke-width:1.5}.bit.active{fill:#fff0d8;stroke:#bc6b00;stroke-width:2}.table-head{fill:#0b1f33}.table-head-text{fill:#fff;font-size:18px;font-weight:600}.table-cell{font-size:18px}.table-row{fill:#fff;stroke:#d9e4eb}.table-row.active{fill:#e0f3ef;stroke:#007c83}
  @keyframes flow{from{stroke-dashoffset:36;opacity:.3}to{stroke-dashoffset:0;opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="100%" height="100%" fill="#f8fbfc"/><rect width="100%" height="100%" fill="url(#grid)"/><text x="36" y="42" class="title" text-anchor="start"><tspan x="36" dy="0">Đổi đơn vị dung lượng</tspan></text><text x="480" y="145" class="title" text-anchor="middle"><tspan x="480" dy="0">6,220,800 bytes</tspan></text><rect x="180" y="210" width="600" height="70" rx="8" class="table-head"/><text x="192" y="256.9" class="table-head-text" text-anchor="start"><tspan x="192" dy="0">Unit</tspan></text><text x="492" y="256.9" class="table-head-text" text-anchor="start"><tspan x="492" dy="0">Value</tspan></text><rect x="180" y="280" width="600" height="70" class="table-row "/><text x="192" y="326.9" class="table-cell" text-anchor="start"><tspan x="192" dy="0">MB</tspan></text><text x="492" y="326.9" class="table-cell" text-anchor="start"><tspan x="492" dy="0">6.2208</tspan></text><rect x="180" y="350" width="600" height="70" class="table-row "/><text x="192" y="396.9" class="table-cell" text-anchor="start"><tspan x="192" dy="0">MiB</tspan></text><text x="492" y="396.9" class="table-cell" text-anchor="start"><tspan x="492" dy="0">5.9326</tspan></text></svg>