<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Dạng đóng gói"><title>Dạng đóng gói</title><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#007c83"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dde7ec"/></pattern></defs><style>
  text{font-family:Segoe UI,Arial,sans-serif;fill:#0b1f33;font-size:20px;font-variant-numeric:tabular-nums}
