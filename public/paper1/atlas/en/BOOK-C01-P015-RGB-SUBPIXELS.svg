<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="RGB component arrangements"><title>RGB component arrangements</title><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#007c83"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dde7ec"/></pattern></defs><style>
  text{font-family:Segoe UI,Arial,sans-serif;fill:#0b1f33;font-size:20px;font-variant-numeric:tabular-nums}
  .label{font-size:20px}.small,.muted{font-size:17px;fill:#52677a}.title,.heading{font-size:28px;font-weight:700}.value{font-size:28px;font-weight:700;font-family:Consolas,monospace}
  rect.active,path.active,circle.active{fill:#e3f3f2;stroke:#007c83;stroke-width:3}rect.muted,path.muted,circle.muted{fill:#e8eef2;stroke:#839ead;stroke-width:2}
  .accent{fill:#007c83}.error{fill:#b33135}.success{fill:#176749}.wire{stroke:#738e9e;stroke-width:3;fill:none}.signal{stroke:#007c83;stroke-width:4;fill:none;stroke-dasharray:12 6;animation:flow .65s ease-out 1}
  .component{fill:#fff;stroke:#c8d8e1;stroke-width:2}.component.active{fill:#e3f3f2;stroke:#007c83;stroke-width:3}.active text{fill:#005e65}.box-title{font-size:18px;fill:#52677a;font-weight:600}.box-value{font-size:24px;font-weight:700}
  .bit{fill:#f5f8fa;stroke:#c8d8e1;stroke-width:1.5}.bit.active{fill:#fff0d8;stroke:#bc6b00;stroke-width:2}.table-head{fill:#0b1f33}.table-head-text{fill:#fff;font-size:18px;font-weight:600}.table-cell{font-size:18px}.table-row{fill:#fff;stroke:#d9e4eb}.table-row.active{fill:#e0f3ef;stroke:#007c83}
  @keyframes flow{from{stroke-dashoffset:36;opacity:.3}to{stroke-dashoffset:0;opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="100%" height="100%" fill="#f8fbfc"/><rect width="100%" height="100%" fill="url(#grid)"/><text x="36" y="42" class="title" text-anchor="start"><tspan x="36" dy="0">RGB component arrangements</tspan></text><rect x="130" y="160" width="85" height="165" rx="8" fill="#d83035" stroke="#c8d8e1" stroke-width="2"/><text x="173" y="370" class="value" text-anchor="middle"><tspan x="173" dy="0">R</tspan></text><rect x="230" y="160" width="85" height="165" rx="8" fill="#268847" stroke="#c8d8e1" stroke-width="2"/><text x="273" y="370" class="value" text-anchor="middle"><tspan x="273" dy="0">G</tspan></text><rect x="330" y="160" width="85" height="165" rx="8" fill="#2d6fbb" stroke="#c8d8e1" stroke-width="2"/><text x="373" y="370" class="value" text-anchor="middle"><tspan x="373" dy="0">B</tspan></text><circle cx="730" cy="210" r="30" fill="#d83035" stroke="#007c83" stroke-width="3"/><circle cx="690" cy="280" r="30" fill="#268847" stroke="#007c83" stroke-width="3"/><circle cx="770" cy="280" r="30" fill="#2d6fbb" stroke="#007c83" stroke-width="3"/></svg>