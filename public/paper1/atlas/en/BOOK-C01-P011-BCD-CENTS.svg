  .component{fill:#fff;stroke:#c8d8e1;stroke-width:2}.component.active{fill:#e3f3f2;stroke:#007c83;stroke-width:3}.active text{fill:#005e65}.box-title{font-size:18px;fill:#52677a;font-weight:600}.box-value{font-size:24px;font-weight:700}
  .bit{fill:#f5f8fa;stroke:#c8d8e1;stroke-width:1.5}.bit.active{fill:#fff0d8;stroke:#bc6b00;stroke-width:2}.table-head{fill:#0b1f33}.table-head-text{fill:#fff;font-size:18px;font-weight:600}.table-cell{font-size:18px}.table-row{fill:#fff;stroke:#d9e4eb}.table-row.active{fill:#e0f3ef;stroke:#007c83}
  @keyframes flow{from{stroke-dashoffset:36;opacity:.3}to{stroke-dashoffset:0;opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
