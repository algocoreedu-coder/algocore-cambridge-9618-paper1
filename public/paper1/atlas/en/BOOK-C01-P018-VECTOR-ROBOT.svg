<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="Robot built from geometric primitives"><title>Robot built from geometric primitives</title><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#007c83"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dde7ec"/></pattern></defs><style>
  text{font-family:Segoe UI,Arial,sans-serif;fill:#0b1f33;font-size:20px;font-variant-numeric:tabular-nums}
  .label{font-size:20px}.small,.muted{font-size:17px;fill:#52677a}.title,.heading{font-size:28px;font-weight:700}.value{font-size:28px;font-weight:700;font-family:Consolas,monospace}
  rect.active,path.active,circle.active{fill:#e3f3f2;stroke:#007c83;stroke-width:3}rect.muted,path.muted,circle.muted{fill:#e8eef2;stroke:#839ead;stroke-width:2}
  .accent{fill:#007c83}.error{fill:#b33135}.success{fill:#176749}.wire{stroke:#738e9e;stroke-width:3;fill:none}.signal{stroke:#007c83;stroke-width:4;fill:none;stroke-dasharray:12 6;animation:flow .65s ease-out 1}
  .component{fill:#fff;stroke:#c8d8e1;stroke-width:2}.component.active{fill:#e3f3f2;stroke:#007c83;stroke-width:3}.active text{fill:#005e65}.box-title{font-size:18px;fill:#52677a;font-weight:600}.box-value{font-size:24px;font-weight:700}
  .bit{fill:#f5f8fa;stroke:#c8d8e1;stroke-width:1.5}.bit.active{fill:#fff0d8;stroke:#bc6b00;stroke-width:2}.table-head{fill:#0b1f33}.table-head-text{fill:#fff;font-size:18px;font-weight:600}.table-cell{font-size:18px}.table-row{fill:#fff;stroke:#d9e4eb}.table-row.active{fill:#e0f3ef;stroke:#007c83}
  @keyframes flow{from{stroke-dashoffset:36;opacity:.3}to{stroke-dashoffset:0;opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="100%" height="100%" fill="#f8fbfc"/><rect width="100%" height="100%" fill="url(#grid)"/><text x="36" y="42" class="title" text-anchor="start"><tspan x="36" dy="0">Robot built from geometric primitives</tspan></text><rect x="350" y="80" width="220" height="100" rx="8" fill="#d3eaf1" stroke="#c8d8e1" stroke-width="2"/><circle cx="410" cy="120" r="17" fill="#79b0c9" stroke="#007c83" stroke-width="3"/><circle cx="510" cy="120" r="17" fill="#79b0c9" stroke="#007c83" stroke-width="3"/><ellipse cx="460" cy="159" rx="35" ry="9" fill="#007c83"/><rect x="445" y="181" width="30" height="25" rx="8" fill="#b9d9e5" stroke="#c8d8e1" stroke-width="2"/><rect x="380" y="210" width="160" height="155" rx="8" fill="#d3eaf1" stroke="#c8d8e1" stroke-width="2"/><path d="M460 239L428 290L492 290Z" fill="#ffcf83" stroke="#c48520"/><path d="M380 240L290 240" stroke="#79b0c9" stroke-width="16" fill="none"/><path d="M540 240L630 240" stroke="#79b0c9" stroke-width="16" fill="none"/><path d="M420 365L420 430" stroke="#79b0c9" stroke-width="18" fill="none"/><path d="M500 365L500 430" stroke="#79b0c9" stroke-width="18" fill="none"/><text x="680" y="140" class="small" text-anchor="start"><tspan x="680" dy="0">rect(x,y,w,h)</tspan></text><text x="680" y="190" class="small" text-anchor="start"><tspan x="680" dy="0">circle(cx,cy,r)</tspan></text><text x="680" y="240" class="small" text-anchor="start"><tspan x="680" dy="0">ellipse(cx,cy,rx,ry)</tspan></text><text x="680" y="290" class="small" text-anchor="start"><tspan x="680" dy="0">path(d)</tspan></text></svg>