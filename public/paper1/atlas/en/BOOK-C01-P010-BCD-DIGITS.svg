<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="The ten legal BCD digits"><title>The ten legal BCD digits</title><defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#007c83"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dde7ec"/></pattern></defs><style>
  text{font-family:Segoe UI,Arial,sans-serif;fill:#0b1f33;font-size:20px;font-variant-numeric:tabular-nums}
  .label{font-size:20px}.small,.muted{font-size:17px;fill:#52677a}.title,.heading{font-size:28px;font-weight:700}.value{font-size:28px;font-weight:700;font-family:Consolas,monospace}
  rect.active,path.active,circle.active{fill:#e3f3f2;stroke:#007c83;stroke-width:3}rect.muted,path.muted,circle.muted{fill:#e8eef2;stroke:#839ead;stroke-width:2}
  .accent{fill:#007c83}.error{fill:#b33135}.success{fill:#176749}.wire{stroke:#738e9e;stroke-width:3;fill:none}.signal{stroke:#007c83;stroke-width:4;fill:none;stroke-dasharray:12 6;animation:flow .65s ease-out 1}
  .component{fill:#fff;stroke:#c8d8e1;stroke-width:2}.component.active{fill:#e3f3f2;stroke:#007c83;stroke-width:3}.active text{fill:#005e65}.box-title{font-size:18px;fill:#52677a;font-weight:600}.box-value{font-size:24px;font-weight:700}
  .bit{fill:#f5f8fa;stroke:#c8d8e1;stroke-width:1.5}.bit.active{fill:#fff0d8;stroke:#bc6b00;stroke-width:2}.table-head{fill:#0b1f33}.table-head-text{fill:#fff;font-size:18px;font-weight:600}.table-cell{font-size:18px}.table-row{fill:#fff;stroke:#d9e4eb}.table-row.active{fill:#e0f3ef;stroke:#007c83}
  @keyframes flow{from{stroke-dashoffset:36;opacity:.3}to{stroke-dashoffset:0;opacity:1}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="100%" height="100%" fill="#f8fbfc"/><rect width="100%" height="100%" fill="url(#grid)"/><text x="36" y="42" class="title" text-anchor="start"><tspan x="36" dy="0">The ten legal BCD digits</tspan></text><rect x="35" y="85" width="890" height="42" rx="8" class="table-head"/><text x="47" y="113.14" class="table-head-text" text-anchor="start"><tspan x="47" dy="0">Digit</tspan></text><text x="492" y="113.14" class="table-head-text" text-anchor="start"><tspan x="492" dy="0">BCD</tspan></text><rect x="35" y="127" width="890" height="42" class="table-row "/><text x="47" y="155.14" class="table-cell" text-anchor="start"><tspan x="47" dy="0">8</tspan></text><text x="492" y="155.14" class="table-cell" text-anchor="start"><tspan x="492" dy="0">1000</tspan></text><rect x="35" y="169" width="890" height="42" class="table-row "/><text x="47" y="197.14" class="table-cell" text-anchor="start"><tspan x="47" dy="0">9</tspan></text><text x="492" y="197.14" class="table-cell" text-anchor="start"><tspan x="492" dy="0">1001</tspan></text><text x="40" y="475" class="small" text-anchor="start"><tspan x="40" dy="0">9–10 / 10</tspan></text></svg>